<style>

body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}

main{max-width:720px;margin:0 auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}
.row+.row{margin-top:8px}
.grow{flex:1;min-width:0}
.item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border:0}
.item input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--ok)}
.done .t{text-decoration:line-through;color:var(--mu)}
.t{word-break:break-word}
.m{font-size:13px;color:var(--mu)}
.tag{font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}
.late{color:#e03131;border-color:#e03131}
button,input,select,textarea{font:inherit;color:inherit}

textarea{min-height:120px}

.days input{display:none}
.days input:checked+span{color:var(--ac);font-weight:700}
.days label:has(input:checked){border-color:var(--ac)}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:10px 2px;font-size:12px;color:var(--mu)}
nav button b{display:block;font-size:20px;font-weight:400}

h2{font-size:16px;margin:16px 4px 4px}
h3{font-size:14px;margin:12px 0 2px;color:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:18px 0}
.ev{padding:8px 0;border-bottom:1px solid var(--ln)}

.wd{text-align:center;padding:2px 0;color:var(--mu);font-size:11px}

.wd.t{color:var(--ac)}.wd.t b{background:var(--ac);color:#fff}

.wcol{position:relative;border-left:1px solid var(--ln)}
.whr{position:absolute;left:0;right:0;border-top:1px solid var(--ln)}
.wlab{position:absolute;right:3px;font-size:9px;color:var(--mu);transform:translateY(-50%)}

const dt=s=>new Date(s+'T00:00');
const mondayOf=s=>{const d=dt(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const cfg=p=>S.planCfg[p.id]||(S.planCfg[p.id]={});

const dayDate=(p,n,dow)=>{const d=mondayOf(pStart(p));d.setDate(d.getDate()+7*(n-1)+(dow==0?6:dow-1));return ymd(d)};
/* 진도 미루기: 미룬 날(평일)부터 그 뒤 평일 진도가 하루씩 밀려요. 토·일 내용(휴무·주간 복습/점검)은 제자리예요 */
const pShifts=p=>[...new Set([...(p.shifts||[]),...(cfg(p).shifts||[])])].sort();
const nextWd=s=>{const d=dt(s);do d.setDate(d.getDate()+1);while(d.getDay()==0||d.getDay()==6);return ymd(d)};
const prevWd=s=>{const d=dt(s);do d.setDate(d.getDate()-1);while(d.getDay()==0||d.getDay()==6);return ymd(d)};
function slotDate(p,n,dow){   // 원래 일정 칸(n주차 dow요일)이 실제로 놓이는 날짜
  let D=dayDate(p,n,dow);if(dow==0||dow==6)return D;
  const off=cfg(p).offset||0;   // 평일 단위로 당기기(-)·늦추기(+)
  for(let o=off;o<0;o++)D=prevWd(D);
  for(let o=off;o>0;o--)D=nextWd(D);
  for(const s of pShifts(p))if(s<=D)D=nextWd(D);
  return D;
}

    const wk=d>=1&&d<=5;if(wk)ses++;
    const date=slotDate(p,w.n,d);if(sk.includes(date))return;   // 건너뛴 날: 그날 할 일은 미루지 않고 버려요
    L.forEach((t,i)=>out.push({id:p.id+'|'+w.n+'|'+d+'|'+i,t,n:w.n,d,date,ses:wk?ses:0,wt:w.title}));
  }));
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
/* 회차제 로드맵 (영어 11-09 요청): 요일을 정하지 않고 주 할당(perWeek)만 채워요.
   못 한 회차는 다음 주에 순서대로 이어서 하고, 빨리 끝나면 미리 해도 돼요. 오늘 탭에는 다음 회차가 하나씩 나와요 */
function uDone(p){const m={},pre=p.id+'|u|';for(const d in S.log)for(const k in S.log[d])if(S.log[d][k]&&k.startsWith(pre)&&!(m[k]&&m[k]<d))m[k]=d;return m}   // 회차 id → 한 날
function quotaTasks(p,date){
  const n=weekNo(p,date);if(n<1||!p.units)return [];
  const m=uDone(p),mon=ymd(mondayOf(date)),sun=addDay(mon,6),U=p.units.map((u,i)=>({...u,id:p.id+'|u|'+(i+1),k:i+1}));
  const wk=U.filter(u=>!u.chk&&m[u.id]&&m[u.id]>=mon&&m[u.id]<=sun).length;   // 점검은 주 할당에 세지 않아요
  const out=U.filter(u=>m[u.id]==date);
  if(!(p.noSun&&dt(date).getDay()==0)&&date>=ymd()){const nx=U.find(u=>!m[u.id]);if(nx)out.push({...nx,extra:!nx.chk&&wk>=p.perWeek})}
  return out.map(u=>({id:u.id,text:u.t,note:[u.n||'',u.extra?'이번 주 할당은 채웠어요 — 미리 해도 돼요 (선택)':''].filter(Boolean).join('\n'),

    plan:p,n,ses:u.k,tag:u.chk?'단원 점검':(u.no||u.k+'회차'),wt:`이번 주 ${wk}/${p.perWeek}회차`}));
}
function planTasks(date){
  const out=[];
  S.plans.filter(p=>pOn(p)&&!p.kind).forEach(p=>{   // 건강(kind) 로드맵은 오늘의 학습이 아니라 건강 탭에서
    if(p.units)quotaTasks(p,date).forEach(x=>out.push(x));
    planSlots(p).filter(x=>x.date==date).forEach(x=>out.push({id:x.id,text:tTxt(x.t),note:tNote(x.t),plan:p,n:x.n,ses:x.ses,wt:x.wt}));
  });
  return out;
}
/* 로드맵 탭: 실제 달력 주(월~일) 단위로 보여 줘요. 요일은 실제 날짜의 요일이에요 */
function calWeeks(p,today){
  const g={},thisMon=ymd(mondayOf(today));
  planSlots(p).forEach(x=>{const k=ymd(mondayOf(x.date));(g[k]=g[k]||[]).push(x)});
  return Object.keys(g).sort().map(k=>{
    const L=g[k],wd=L.filter(x=>isDone(x.date,x.id)).length,byDate={};
    L.forEach(x=>(byDate[x.date]=byDate[x.date]||[]).push(x));
    const body=Object.keys(byDate).sort().map(d=>`<h3>${WD[dt(d).getDay()]} ${md(d)}${d==today?' · 오늘':''}</h3>`+byDate[d].map(x=>{const ck=isDone(d,x.id);
      return `<div class="item ${ck?'done':''}"><input type="checkbox" ${ck?'checked':''} onchange="pTick('${d}','${x.id}')"><div class="grow"><div class="t">${esc(tTxt(x.t))}</div>${tNote(x.t)?`<div class="m" style="white-space:pre-line">${esc(tNote(x.t))}</div>`:''}<div class="m"><span class="tag">${x.ses?x.ses+'회차':'주말'}</span> ${x.n}주차 · ${esc(x.wt)}</div></div></div>`}).join('')).join('');
    return `<details ${k==thisMon?'open':''} style="margin-top:6px"><summary>${md(k)}–${md(addDay(k,6))} <span class="tag">${wd}/${L.length}</span>${k==thisMon?' <span class="tag late">이번 주</span>':''}</summary>${body}</details>`;
  }).join('');
}
function pShiftToday(id){

   그 날짜 전의 로드맵 체크 기록과 미루기 기록만 지우고, 체중·퀘스트·일일 퀘스트는 그대로 둬요 */

const tMin=s=>{if(!s)return null;const[a,b]=s.split(':').map(Number);return a*60+b};
const tStr=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.round(m%60)).padStart(2,'0');
function tSet(date,k,v){const o=S.times[date]=S.times[date]||{};if(v)o[k]=v;else delete o[k];if(!Object.keys(o).length)delete S.times[date];save();render()}

let tRange=14;
function timeChart(){
  const end=ymd(),days=[];for(let i=tRange-1;i>=0;i--)days.push(addDay(end,-i));
  const K=[['wake','기상','#4285f4'],['office','출근','#f4511e']];
  const vals=days.flatMap(d=>K.map(k=>tMin((S.times[d]||{})[k[0]])).filter(v=>v!=null));
  const btn=`<div class="row" style="margin-top:6px">${[[14,'2주'],[30,'1개월'],[90,'3개월']].map(([n,l])=>`<button class="${tRange==n?'p':''}" style="flex:1;padding:5px 2px;font-size:13px" onclick="tRange=${n};render()">${l}</button>`).join('')}</div>`;
  if(!vals.length)return `<div class="card"><b>⏰ 기상 · 출근 시각</b><div class="empty m">오늘 탭에서 시각을 기록하면 그래프가 나와요</div>${btn}</div>`;
  const lo=Math.floor(Math.min(...vals)/60)*60-30,hi=Math.ceil(Math.max(...vals)/60)*60+30;
  const W=360,H=200,L=40,R=10,T=10,B=24;
  const X=i=>L+(days.length>1?i/(days.length-1):.5)*(W-L-R),Y=m=>T+(m-lo)/(hi-lo)*(H-T-B);   // 위가 이른 시각
  const step=(hi-lo)>360?120:60,grid=[];for(let m=Math.ceil(lo/step)*step;m<=hi;m+=step)grid.push(m);
  const every=Math.ceil(days.length/7);
  const lines=K.map(([k,n,c])=>{
    const pts=days.map((d,i)=>[i,tMin((S.times[d]||{})[k])]).filter(x=>x[1]!=null);
    return `<polyline points="${pts.map(x=>X(x[0]).toFixed(1)+','+Y(x[1]).toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>`+
      pts.map(x=>`<circle cx="${X(x[0])}" cy="${Y(x[1])}" r="${days.length>30?2:3.5}" fill="${c}"><title>${md(days[x[0]])} ${n} ${tStr(x[1])}</title></circle>`).join('')}).join('');
  const avg=k=>{const v=days.slice(-7).map(d=>tMin((S.times[d]||{})[k])).filter(x=>x!=null);return v.length?tStr(v.reduce((a,b)=>a+b)/v.length):'-'};
  return `<div class="card"><b>⏰ 기상 · 출근 시각</b>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:8px;font-size:10px" role="img" aria-label="기상과 출근 시각 그래프">
    ${grid.map(m=>`<line x1="${L}" x2="${W-R}" y1="${Y(m)}" y2="${Y(m)}" stroke="var(--ln)"/><text x="${L-4}" y="${Y(m)+3}" text-anchor="end" fill="var(--mu)">${tStr(m)}</text>`).join('')}
    ${days.map((d,i)=>i%every==0||i==days.length-1?`<text x="${X(i)}" y="${H-8}" text-anchor="middle" fill="var(--mu)">${md(d)}</text>`:'').join('')}
    ${lines}</svg>
    <div class="m"><span style="color:#4285f4">━</span> 기상 (최근 7일 평균 ${avg('wake')}) &nbsp; <span style="color:#f4511e">━</span> 출근 (평균 ${avg('office')}) · 위쪽이 이른 시각</div>${btn}</div>`;
}

function evSpan(e){
  if(e.start.date){const s=dt(e.start.date),en=e.end&&e.end.date?dt(e.end.date):new Date(s.getTime()+864e5);return{all:1,s,e:en}}
  const s=new Date(e.start.dateTime),en=e.end&&e.end.dateTime?new Date(e.end.dateTime):new Date(s.getTime()+36e5);return{all:0,s,e:en};
}
function wkLayout(list){   // 시간이 겹치는 일정은 가로로 나눠 배치
  list.sort((a,b)=>a.sm-b.sm||b.em-a.em);
  const out=[];let cl=[],end=-1;
  const flush=()=>{const cols=[];cl.forEach(c=>{let k=cols.findIndex(x=>x<=c.sm);if(k<0){k=cols.length;cols.push(0)}cols[k]=c.em;c.col=k});cl.forEach(c=>c.n=cols.length);out.push(...cl);cl=[]};
  list.forEach(c=>{if(cl.length&&c.sm>=end){flush();end=-1}cl.push(c);end=Math.max(end,c.em)});
  if(cl.length)flush();return out;
}
/* 평일 일과표(참고용): 로드맵 데이터(kind routine)에 있고 드라이브로만 동기화돼요. 주간 일정 뒤에 옅게 깔려요 */
const routine=()=>S.plans.find(p=>p.kind=='routine');
function bgBlocks(RT,d,lo,HH){
  if(!RT)return '';
  return (RT.days[d.getDay()]||[]).map(([a,b,n,k])=>{const s=tMin(a),e=tMin(b),h=(e-s)/60*HH;
    return `<div class="wbg ${k}" style="top:${(s/60-lo)*HH}px;height:${Math.max(2,h)}px" title="${a}–${b} ${esc(n)}">${h>=12?esc(n):''}</div>`}).join('');
}
function routineCard(p){
  const W=['일','월','화','수','목','금','토'];
  return `<div class="card"><b>${esc(p.name)}</b><div class="m">캘린더 탭이 아니라 오늘 탭의 <b>주간 일정</b> 뒤에 옅게 깔려요. 구글 캘린더 일정은 그 위에 보여요.</div>`+
    Object.keys(p.days).sort().map(k=>`<details style="margin-top:6px"><summary>${W[k]}요일</summary>${p.days[k].map(([a,b,n])=>`<div class="m">${a}–${b} · ${esc(n)}</div>`).join('')}</details>`).join('')+
    `<div class="row" style="margin-top:8px"><button class="i" onclick="pDel('${p.id}')">일과표 삭제</button></div></div>`;
}
function weekGo(n){weekOff=n==0?0:Math.max(0,weekOff+n);render()}
function evInfo(i){const x=weekList[i];if(!x)return;const t=x.all?'종일':x.s.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' – '+x.e.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});alert((x.ev.summary||'(제목 없음)')+'\n'+md(ymd(x.s))+' '+t)}
function weekEvents(){
  const mon=mondayOf(ymd());mon.setDate(mon.getDate()+7*weekOff);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d});
  const today=ymd(),a=ymd(days[0]),b=ymd(days[6]);
  const nav=`<div class="row" style="margin-bottom:6px"><button class="i" onclick="weekGo(-1)" ${weekOff?'':'disabled'}>◀</button>
    <div class="grow" style="text-align:center"><b>${md(a)} – ${md(b)}</b>${weekOff==0?' · 이번 주':''}</div>
    <button class="i" onclick="weekGo(1)">▶</button>${weekOff?'<button class="i" onclick="weekGo(0)">이번 주</button>':''}</div>`;
  if(!events)return `<h2>🗓️ 주간 일정</h2><div class="card">${nav}<div class="empty">아직 불러오지 않았어요 <button onclick="loadEvents()">일정 불러오기</button></div></div>`;
  const evs=events.map(ev=>({ev,...evSpan(ev)}));
  weekList=[];const allday=days.map(()=>[]),timed=days.map(()=>[]);
  days.forEach((d,i)=>{
    const de=new Date(d);de.setDate(de.getDate()+1);
    evs.forEach(x=>{
      if(!(x.s<de&&x.e>d))return;
      if(x.all){allday[i].push(x)}
      else{const s=x.s<d?d:x.s,en=x.e>de?de:x.e;timed[i].push({x,sm:(s-d)/6e4,em:Math.max((en-d)/6e4,(s-d)/6e4+25)})}
    });
  });
  let lo=8,hi=20;const all=timed.flat();
  if(all.length){lo=Math.min(8,Math.floor(Math.min(...all.map(c=>c.sm))/60));hi=Math.min(24,Math.max(20,Math.ceil(Math.max(...all.map(c=>c.em))/60)))}
  const RT=routine();
  if(RT){const rm=Object.values(RT.days).flat().flatMap(b=>[tMin(b[0]),tMin(b[1])]);lo=Math.min(lo,Math.floor(Math.min(...rm)/60));hi=Math.min(24,Math.max(hi,Math.ceil(Math.max(...rm)/60)))}
  const nowM=(new Date()-dt(today))/6e4;
  const HH=34,hrs=[];for(let h=lo;h<hi;h++)hrs.push(h);
  const idx=x=>{weekList.push(x);return weekList.length-1};
  const head=`<div class="wkg"><div></div>${days.map(d=>`<div class="wd ${ymd(d)==today?'t':''}">${DAYS[d.getDay()]}<b>${d.getDate()}</b></div>`).join('')}</div>`;
  const hasAll=allday.some(l=>l.length);
  const adRow=hasAll?`<div class="wkg" style="margin-bottom:2px"><div class="m" style="font-size:9px;text-align:right;padding-right:3px">종일</div>${allday.map(l=>`<div style="min-width:0">${l.map(x=>`<div class="wad" style="background:${evColor(x.ev)}" title="${esc(x.ev.summary||'')}" onclick="evInfo(${idx(x)})">${esc(x.ev.summary||'(제목 없음)')}</div>`).join('')}</div>`).join('')}</div>`:'';
  const showNow=weekOff==0&&nowM/60>=lo&&nowM/60<hi;
  const cols=days.map((d,i)=>{
    const L=wkLayout(timed[i]);
    return `<div class="wcol" style="height:${hrs.length*HH}px">${bgBlocks(RT,d,lo,HH)}${L.map(c=>`<div class="wke" style="top:${(c.sm/60-lo)*HH}px;height:${Math.max(14,(c.em-c.sm)/60*HH-1)}px;left:${c.col/c.n*100}%;width:${100/c.n}%;background:${evColor(c.x.ev)}" title="${esc(c.x.ev.summary||'')}" onclick="evInfo(${idx(c.x)})">${esc(c.x.ev.summary||'(제목 없음)')}</div>`).join('')}${ymd(d)==today&&showNow?`<div class="wnow" id="wnow" style="top:${(nowM/60-lo)*HH}px"></div>`:''}</div>`}).join('');
  const labels=`<div style="position:relative;height:${hrs.length*HH}px">${hrs.map((h,i)=>`<div class="wlab" style="top:${i*HH}px">${i?h:''}</div>`).join('')}</div>`;
  const lines=hrs.map((h,i)=>`<div class="whr" style="top:${i*HH}px"></div>`).join('');
  const body=`<div class="wbody" id="wbody" data-lo="${lo}" data-hh="${HH}" ${showNow?`data-now="${(nowM/60-lo)*HH}"`:''}><div style="position:absolute;left:28px;right:0;top:0;height:${hrs.length*HH}px">${lines}</div>
    <div class="wkg" style="position:relative">${labels}${cols}</div></div>`;
  return `<h2>🗓️ 주간 일정</h2><div class="card" style="padding:10px 8px">${nav}${head}${adRow}${body}
    ${S.evAt?`<div class="m" style="margin-top:6px;padding:0 6px">${new Date(S.evAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} 기준 <button class="i" onclick="loadEvents()">새로고침</button></div>`:''}</div>`;
}

function parseRoad(txt){
  const out=[];let p=null,ph='';
  txt.split(/\r?\n/).forEach(l=>{
    let m;l=l.trim();
    if(m=l.match(/^#\s+(.+)/)){p={id:uid(),name:m[1],items:[]};out.push(p);ph=''}
    else if(m=l.match(/^#{2,}\s+(.+)/)){ph=m[1]}
    else if(m=l.match(/^[-*]\s*\[( |x|X)\]\s*(.+)/)){if(!p){p={id:uid(),name:'로드맵',items:[]};out.push(p)}p.items.push({id:uid(),title:m[2],phase:ph,done:m[1]!=' '})}
    else if(m=l.match(/^[-*]\s+(.+)/)){if(!p){p={id:uid(),name:'로드맵',items:[]};out.push(p)}p.items.push({id:uid(),title:m[1],phase:ph,done:false})}
  });
  return out;
}

const HP=()=>S.plans.find(p=>p.kind=='health');
const hHash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const hRng=seed=>{let a=seed;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
function hCombos(p){   // 칼로리·단백질 범위 안, 컵누들·참치는 하루 1번까지인 아침·점심·저녁 조합
  const M=p.meals,L=p.limits,out=[];
  M.b.forEach(b=>M.l.forEach(l=>M.d.forEach(d=>{
    const k=b.kcal+l.kcal+d.kcal,pr=b.p+l.p+d.p,cup=(b.cup||0)+(l.cup||0)+(d.cup||0),tu=(b.tuna||0)+(l.tuna||0)+(d.tuna||0);
    if(k>=L.min&&k<=L.max&&pr>=L.pro&&pr<=L.proMax&&cup>=(L.cupMin||0)&&cup<=(L.cupMax??1)&&tu<=1)out.push({m:[b,l,d],k,p:pr});})));
  return out;
}
function hPick(p,date,avoid){
  let all=hCombos(p);if(!all.length)return null;
  if(avoid){const f=all.filter(c=>c.m.every((x,i)=>x.id!=avoid.m[i].id));if(f.length)all=f}   // 전날과 같은 메뉴는 피함
  const r=hRng(hHash(date+'|'+((S.health[date]||{}).re||0)+'|'+p.id));
  return all[Math.floor(r()*all.length)];
}
function hMenu(p,date){
  if(!p.menus)return hPick(p,date,hPick(p,addDay(date,-1),null));
  // 식단 30종: 다이어트 시작일부터 하루씩 순서대로 돌아가요. 🔀 는 컵누들 여부가 같은 다른 식단으로 바꿔요 (컵누들 주 3회 이내 유지)
  const M=p.menus,n=M.length,base=((Math.round((dt(date)-dt(pStart(p)))/864e5)%n)+n)%n,re=(S.health[date]||{}).re||0;
  let i=base;if(re){const alt=M.map((x,j)=>j).filter(j=>j!=base&&M[j].cup==M[base].cup);if(alt.length)i=alt[(re-1)%alt.length]}
  const x=M[i];let m=x.m.map((m,k)=>({...m,id:i+'-'+k})),k=x.kcal,pr=x.p;
  // 점심 자동 교체 (Diet방 11-09): 저녁 메뉴·전날 과식 여부에 따라 계획(p.lunchRule)대로 바꿈
  const cur=S.health[date]||{},prev=S.health[addDay(date,-1)]||{},LR=p.lunchRule||{},fl=p.lunch&&(LR[cur.dn]||(prev.over?LR.over:null));
  if(fl&&m[1]&&m[1].c!=fl){const L=p.lunch[fl];k+=L.kcal-m[1].kcal;pr+=L.p-m[1].p;m[1]={...L,id:fl,why:LR[cur.dn]==fl?'오늘 저녁 메뉴에 맞춤':'어제 저녁 과식'}}
  return {m,k,p:pr,no:i+1};
}
function hPhase(p,date){   // 서킷 적응기: 주차별 세트 수 · 휴식 · 바뀐 동작
  const P=p.phases;if(!P)return {sets:3,rest:'1분',name:'',mods:{}};
  const n=weekNo(p,date);return P.find(x=>n<=x.to)||P[P.length-1];
}
const hd=date=>S.health[date]||(S.health[date]={});
function hAvg(date,n){const v=[];for(let i=0;i<n;i++){const w=parseFloat((S.health[addDay(date,-i)]||{}).weight);if(w>0)v.push(w)}return v.length?v.reduce((a,b)=>a+b)/v.length:null}
const hDayOk=(p,date)=>{const h=S.health[date];return !!h&&(h.sets||0)>=hPhase(p,date).sets&&(+h.steps||0)>=(p.goalSteps||10000)};
function hTick(date,k){const h=hd(date);h[k]=!h[k];save();render()}
function hSet(date,k,v){hd(date)[k]=v;save();render()}
function hSets(date,i,on){hd(date).sets=on?i:i-1;save();render()}
function hReroll(date){
  const p=HP(),h=hd(date),sig=()=>{const c=hMenu(p,date);return c?c.m.map(m=>m.id).join():''},was=sig();
  for(let i=0;i<20;i++){h.re=(h.re||0)+1;if(sig()!=was)break}   // 눌렀는데 같은 메뉴가 나오지 않게
  save();render();
}
/* 체중 꺾은선 그래프: 실제 체중(실선) + 주차별 체크선(점선) */
function hChart(p){
  const all=Object.keys(S.health).filter(d=>parseFloat(S.health[d].weight)>0).sort().map(d=>[d,parseFloat(S.health[d].weight)]);
  if(!all.length)return '<div class="empty m">체중을 입력하면 그래프가 나와요</div>';
  const R_=S.chartRange||'plan',d0=ymd(mondayOf(pStart(p))),today=ymd();
  const last=Math.max(...p.weeks.map(w=>w.n)),dEnd=dayDate(p,last,0);
  let lo,hi;
  if(R_=='plan'){lo=addDay(d0,-14);hi=dEnd}                      // 다이어트 시작 2주 전 ~ 6주차 끝
  else if(R_=='3m'){lo=addDay(today,-90);hi=[today,dEnd].sort().pop()}
  else if(R_=='6m'){lo=addDay(today,-182);hi=[today,dEnd].sort().pop()}
  else{lo=all[0][0];hi=[all[all.length-1][0],dEnd].sort().pop()}
  const pts=all.filter(x=>x[0]>=lo&&x[0]<=hi);
  const span=Math.max(1,Math.round((dt(hi)-dt(lo))/864e5));
  const chk=p.weeks.map(w=>[w.date||dayDate(p,w.n,0),w.line]).filter(x=>x[0]>=lo&&x[0]<=hi);
  const ys=pts.map(x=>x[1]).concat(chk.map(x=>x[1]));
  if(!ys.length)return `<div class="empty m">이 기간에는 기록이 없어요</div>${hRangeBtns()}`;
  const ymin=Math.floor(Math.min(...ys)-1),ymax=Math.ceil(Math.max(...ys)+1);
  const W=360,H=190,L=34,R=10,T=10,B=24;
  const X=d=>L+(Math.round((dt(d)-dt(lo))/864e5)/span)*(W-L-R), Y=v=>T+(ymax-v)/(ymax-ymin)*(H-T-B);
  const step=(ymax-ymin)>12?4:2, grid=[];for(let v=Math.ceil(ymin/step)*step;v<=ymax;v+=step)grid.push(v);
  const line=a=>a.map(x=>X(x[0]).toFixed(1)+','+Y(x[1]).toFixed(1)).join(' ');
  let xl;
  if(R_=='plan')xl=p.weeks.map(w=>[dayDate(p,w.n,1),w.n+'주']);
  else{xl=[];const e=dt(lo);e.setDate(1);for(e.setMonth(e.getMonth()+1);ymd(e)<=hi;e.setMonth(e.getMonth()+1))xl.push([ymd(e),(e.getMonth()+1)+'월'])}   // 월 눈금
  xl=xl.filter(x=>x[0]>=lo&&x[0]<=hi);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:10px;font-size:10px" role="img" aria-label="체중 변화 그래프">
    ${grid.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--ln)"/><text x="${L-4}" y="${Y(v)+3}" text-anchor="end" fill="var(--mu)">${v}</text>`).join('')}
    ${xl.map(x=>`<text x="${X(x[0])}" y="${H-8}" text-anchor="start" fill="var(--mu)">${x[1]}</text>`).join('')}
    <polyline points="${line(chk)}" fill="none" stroke="var(--mu)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polyline points="${line(pts)}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map(x=>`<circle cx="${X(x[0])}" cy="${Y(x[1])}" r="${pts.length>60?1.8:3.5}" fill="var(--ac)"><title>${x[0]} · ${x[1]}kg</title></circle>`).join('')}
  </svg>
  <div class="m"><span style="color:var(--ac)">━</span> 내 체중 &nbsp; <span>┅</span> 주차별 체크선${pts.length?` · 최근 ${pts[pts.length-1][1]}kg${pts.length>1?` (이 기간 처음 대비 ${(pts[pts.length-1][1]-pts[0][1]>0?'+':'')+(pts[pts.length-1][1]-pts[0][1]).toFixed(1)}kg)`:''}`:''}</div>
  ${hRangeBtns()}`;
}
function hRangeBtns(){
  const cur=S.chartRange||'plan';
  return `<div class="row" style="margin-top:6px">${[['plan','다이어트 기간'],['3m','3개월'],['6m','6개월'],['all','전체']].map(([k,n])=>`<button class="${cur==k?'p':''}" style="flex:1;padding:5px 2px;font-size:13px" onclick="S.chartRange='${k}';save();render()">${n}</button>`).join('')}</div>`;

      <div class="grow"><div class="t"><b>저녁</b> 외식 · 곱빼기·사이즈업 없이</div><div class="m">먹을 곳을 고르면 요령이 나와요</div></div></div>
    ${p.dinner.map(([id,nm,tip])=>`<label class="item ${h.dn==id?'done':''}" style="cursor:pointer"><input type="radio" name="dn" ${h.dn==id?'checked':''} onchange="hSet('${date}','dn','${id}')">
      <div class="grow"><div class="t">${esc(nm)}</div>${tip&&h.dn==id?`<div class="m">${esc(tip)}</div>`:''}</div></label>`).join('')}
    ${h.dn?`<div class="row"><span class="grow"></span><button class="i" onclick="hSet('${date}','dn','')">선택 지우기</button></div>`:''}
    <label class="m" style="display:block;margin-top:6px"><input type="checkbox" ${h.over?'checked':''} onchange="hTick('${date}','over')"> 저녁이 700kcal를 넘었어요 → 내일 점심 자동 교체</label>

    ${p.circuit.map((e,i)=>{const x=(ph.mods||{})[i]||e;return `<div class="m">${i+1}. ${esc(x[0])} — ${esc(x[1])}</div>`}).join('')}

async function wImport(f){
  if(!f)return;

    const w=JSON.parse(await f.text());let n=0;
    for(const d in w){if(!/^\d{4}-\d\d-\d\d$/.test(d)||!(parseFloat(w[d])>0))continue;const h=S.health[d]=S.health[d]||{};if(!(parseFloat(h.weight)>0)){h.weight=w[d];n++}}
    save();alert(n+'일치 체중을 넣었어요');render();
  }catch(e){alert('올바른 체중 파일이 아니에요')}
}

async function pImport(files){

let tok=null,events=S.evCache||null;
const gready=()=>window.google&&google.accounts&&google.accounts.oauth2;
function loadGIS(){return new Promise((ok,no)=>{if(gready())return ok();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=()=>no(new Error('Google 스크립트를 불러오지 못했어요'));document.head.appendChild(s)})}
function login(silent){   // async/await를 쓰지 않아요: 버튼을 누른 즉시 같은 흐름에서 팝업을 열어야 아이폰 Safari가 막지 않아요
  if(!S.clientId)return Promise.reject(new Error('먼저 Client ID를 저장해 주세요'));
  if(!gready())return loadGIS().then(()=>login(silent));
  return new Promise((ok,no)=>{
    if(silent)setTimeout(()=>no(new Error('timeout')),8000);   // 팝업이 막히면 포기하고 버튼으로 로그인
    const c=google.accounts.oauth2.initTokenClient({client_id:S.clientId,scope:'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/drive.appdata',
      callback:r=>{if(r.error)return no(new Error(r.error));tok=r.access_token;setTimeout(()=>tok=null,(r.expires_in-60)*1000);ok()},
      error_callback:e=>no(new Error(e.type||'login'))});
    c.requestAccessToken(silent?{prompt:''}:{});
  });
}

/* ---------- 구글 드라이브 동기화 (이 앱 전용 숨김 폴더에 한 파일로 저장) ---------- */
const SYNC_KEYS=['daily','log','main','sub','roadmap','health','plans','planCfg','chartRange','times'];
const SYNC_NAME='quest-planner-data.json',DRV='https://www.googleapis.com/drive/v3/',UPL='https://www.googleapis.com/upload/drive/v3/files';
let fileId=null,pushT=null,busy=false;
function setSync(t){const b=$('#sync');if(b)b.textContent='☁️ '+t}
function schedPush(){
  if(!S.syncOn)return;
  if(tok){clearTimeout(pushT);pushT=setTimeout(()=>syncNow(false),4000)}else setSync('저장 대기 (눌러서 동기화)');
}
async function drive(url,opt={}){
  if(!tok)throw new Error('login');
  const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+tok,...(opt.headers||{})}});
  if(r.status==401){tok=null;throw new Error('login')}
  if(!r.ok)throw new Error('Drive 오류 '+r.status);
  return r;
}
async function dFind(){
  const j=await(await drive(DRV+'files?spaces=appDataFolder&orderBy=createdTime&fields=files(id)&q='+encodeURIComponent(`name='${SYNC_NAME}'`))).json();
  fileId=(j.files&&j.files[0]&&j.files[0].id)||null;return fileId;
}
async function dPull(){if(!fileId&&!await dFind())return null;return(await drive(DRV+'files/'+fileId+'?alt=media')).json()}
async function dPush(pack){
  const meta={name:SYNC_NAME};if(!fileId)meta.parents=['appDataFolder'];
  const B='qpbound',body=`--${B}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${B}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(pack)}\r\n--${B}--`;
  const r=await drive(fileId?`${UPL}/${fileId}?uploadType=multipart`:`${UPL}?uploadType=multipart`,{method:fileId?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+B},body});
  fileId=(await r.json()).id;
}
function mergeIn(rd){   // 두 기기가 모두 바뀐 경우: 합치기 (같은 항목은 이 기기 값이 우선)
  for(const k of SYNC_KEYS){
    const r=rd[k],l=S[k];if(r===undefined)continue;
    if(l===undefined){S[k]=r;continue}
    if(Array.isArray(l)&&Array.isArray(r)){const ids=new Set(l.map(x=>x&&x.id)),R=new Map(r.filter(x=>x&&x.id).map(x=>[x.id,x]));
      S[k]=l.map(x=>{const y=x&&R.get(x.id);return y&&(y.ver||'')>(x.ver||'')?y:x}).concat(r.filter(x=>x&&!ids.has(x.id)))}   // 로드맵은 더 새 판(ver)이 이김
    else if(l&&r&&typeof l=='object'&&typeof r=='object'){
      const o={...r};
      for(const d in l)o[d]=(o[d]&&typeof o[d]=='object'&&typeof l[d]=='object'&&!Array.isArray(l[d]))?{...o[d],...l[d]}:l[d];
      S[k]=o;
    }
  }
}
async function syncNow(interactive){
  if(busy)return;busy=true;setSync('동기화 중…');
  try{
    if(!tok){if(!interactive){setSync('로그인 필요');return}await login(false)}
    const rm=await dPull();
    let up=!!S.dirty||!rm;
    if(rm&&rm.savedAt>(S.syncedAt||0)){
      if(S.dirty){mergeIn(rm.data);up=true}
      else{for(const k of SYNC_KEYS)if(rm.data[k]!==undefined)S[k]=rm.data[k];S.syncedAt=rm.savedAt;up=false}
    }
    if(up){const t=Date.now();await dPush({savedAt:t,data:Object.fromEntries(SYNC_KEYS.map(k=>[k,S[k]]))});S.syncedAt=t;S.dirty=false}
    S.syncOn=true;persist();render();
    setSync('완료 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    console.error(e);
    if(e.message=='login'||e.message=='popup_closed'||e.message=='access_denied'){setSync('로그인 필요');if(interactive&&e.message!='popup_closed')alert('로그인이 필요해요. ☁️ 버튼을 다시 눌러 주세요')}
    else{setSync('오류 (다시 누르기)');if(interactive)alert('동기화 오류: '+e.message)}
  }finally{busy=false}
}
function initSync(){
  loadGIS().catch(()=>{});   // 구글 로그인 스크립트를 미리 받아 둠 (버튼을 눌렀을 때 바로 팝업을 열기 위해)
  // 앱을 연 뒤 처음 화면을 누를 때 조용히 다시 로그인 → 동기화 (로그인은 1시간만 유지되고 브라우저는 몰래 연장할 수 없어서)
  document.addEventListener('pointerdown',()=>{if(S.syncOn&&!tok&&!busy)login(true).then(()=>syncNow(false)).catch(()=>{})},{passive:true});
  if(!S.syncOn){setSync('동기화');return}
  setSync('연결 중…');
  login(true).then(()=>syncNow(false)).catch(()=>setSync('로그인 필요 (눌러서 동기화)'));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'&&tok&&S.syncOn)syncNow(false)});
}
async function g(path,opt={}){
  if(!tok)await login();
  const r=await fetch('https://www.googleapis.com/calendar/v3/'+path,{...opt,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'}});
  if(!r.ok)throw new Error('Google 오류 '+r.status);
  return r.json();
}
const addDay=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
async function calQuest(k,id){
  const q=S[k].find(x=>x.id==id);
  try{
    const e=await g('calendars/primary/events',{method:'POST',body:JSON.stringify({summary:(k=='main'?'🔥 ':'📌 ')+q.title,description:q.memo||'',start:{date:q.due},end:{date:addDay(q.due,1)}})});
    q.gid=e.id;save();alert('캘린더에 등록했어요');render();
  }catch(e){alert(e.message)}
}
async function calDaily(id){
  const q=S.daily.find(x=>x.id==id);
  let d=ymd();for(let i=0;i<7&&!q.days.includes(new Date(d+'T00:00').getDay());i++)d=addDay(d,1);
  try{
    await g('calendars/primary/events',{method:'POST',body:JSON.stringify({summary:'✅ '+q.title,description:q.memo||'',start:{date:d},end:{date:addDay(d,1)},recurrence:['RRULE:FREQ=WEEKLY;BYDAY='+q.days.map(x=>RR[x]).join(',')]})});
    alert('반복 일정으로 등록했어요');
  }catch(e){alert(e.message)}
}
async function loadEvents(){
  try{
    const a=mondayOf(ymd()),b=new Date();b.setMonth(b.getMonth()+1);  // 이번 주 월요일 ~ 1개월 뒤
    const r=await g('calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin='+encodeURIComponent(a.toISOString())+'&timeMax='+encodeURIComponent(b.toISOString()));
    events=(r.items||[]).filter(e=>e.start).map(e=>({summary:e.summary,start:e.start,end:e.end,colorId:e.colorId}));
    S.evCache=events;S.evAt=Date.now();save();msg='';
  }catch(e){msg=e.message}
  render();
}
function vCal(){
  const evs=events?(events.length?events.map(e=>evRow(e,true)).join(''):'<div class="empty">앞으로 1개월간 일정이 없어요</div>'):'';
  return `${safe(timeChart)}
  <div class="card"><b>구글 캘린더 연동</b>
    <p class="m">Google Cloud Console에서 만든 OAuth <b>Client ID</b>(웹 애플리케이션)를 넣고, 승인된 JavaScript 원본에 이 앱의 주소를 등록해야 해요.</p>
    <input type="text" id="cid" value="${esc(S.clientId)}" placeholder="xxxx.apps.googleusercontent.com">
    <div class="row" style="margin-top:8px"><button onclick="S.clientId=$('#cid').value.trim();save();alert('저장했어요')">저장</button>
    <button class="p" onclick="loadEvents()">연결 · 1개월 일정 불러오기</button></div>
    ${msg?`<p class="m" style="color:#e03131">${esc(msg)}</p>`:''}</div>
  ${events?`<div class="card"><b>다가오는 일정</b>${evs}</div>`:''}
  <div class="card"><b>메인·서브 퀘스트 → 캘린더</b><p class="m">마감일이 있는 퀘스트의 📆 버튼으로 종일 일정에 등록돼요. 일일 퀘스트의 📆는 요일 반복 일정으로 등록돼요.</p></div>
  <div class="card"><b>백업 · 기기 간 옮기기</b>
    <p class="m">데이터는 이 기기 브라우저에 저장돼요. 아이폰↔컴퓨터는 파일로 옮겨요.</p>
    <div class="row"><button onclick="bk()">내보내기</button><button onclick="$('#bf').click()">가져오기</button></div>
    <input type="file" id="bf" accept=".json" hidden onchange="rs(this.files[0])"></div>`;
}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='quest-planner-'+ymd()+'.json';a.click()}
function rs(f){if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.daily)throw 0;if(confirm('현재 데이터를 덮어쓸까요?')){S=d;S.plans=S.plans||[];S.planCfg=S.planCfg||{};S.health=S.health||{};S.clientId=S.clientId||DEFAULT_CLIENT;save();render()}}catch(e){alert('올바른 백업 파일이 아니에요')}})}

/* Voca 트레이너(voca.html, 같은 주소)가 1바퀴를 마친 기록 → 그날 Voca 할 일 자동 체크 (Voca방 11-09 · 이 기기 안에서만) */
function vocaSync(){
  let md;try{md=JSON.parse(localStorage.getItem('vocatrainer_v1_mdone'))||{}}catch(e){return}
  const V=S.plans.find(p=>p.id=='voca');if(!V)return;
  const sl=planSlots(V);let ch=0;
  for(const k in md){const r=md[k];if(!r||!r.planDate)continue;
    sl.filter(x=>x.date==r.planDate&&x.n==r.w).forEach(x=>{const l=S.log[x.date]=S.log[x.date]||{};if(!l[x.id]){l[x.id]=true;ch=1}})}
  if(ch)save();
}
safe(vocaSync);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'){safe(vocaSync);render()}});
window.addEventListener('pageshow',()=>{safe(vocaSync);render()});
render();initSync();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});   // 홈 화면 앱으로 설치·오프라인 열기용
