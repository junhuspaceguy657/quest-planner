<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단어 암기 트레이너</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--tx:#e8eaf0;--tx2:#98a0ae;
      --acc:#6ea8fe;--ok:#3fb27f;--no:#e8705c;--gold:#e3b341}
@media (prefers-color-scheme:light){
 :root{--bg:#f5f6f8;--card:#fff;--card2:#f0f2f6;--line:#e2e5ec;--tx:#1c1f26;--tx2:#69707e;
       --acc:#2f6fdd;--ok:#1f9d68;--no:#d1503a;--gold:#b5860b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);min-height:100dvh;display:flex;flex-direction:column;
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Malgun Gothic",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card2);
 border-radius:10px;padding:8px 13px;transition:.12s}
button:hover{border-color:var(--acc)} button:active{transform:scale(.98)}
.ghost{background:transparent}
header{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:14.5px;margin:0;font-weight:600;letter-spacing:-.2px}
header .sp{flex:1}
header button{font-size:12.5px;padding:6px 10px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:16px}
#bar{width:100%;max-width:620px;height:5px;background:var(--card2);border-radius:99px;overflow:hidden}
#bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
#stat{width:100%;max-width:620px;display:flex;gap:13px;justify-content:center;flex-wrap:wrap;
 font-size:12.5px;color:var(--tx2)} #stat b{color:var(--tx);font-weight:600}
.card{width:100%;max-width:620px;min-height:290px;background:var(--card);border:1px solid var(--line);
 border-radius:20px;padding:30px 26px;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:13px;text-align:center;cursor:pointer;user-select:none}
.word{font-size:clamp(30px,7vw,46px);font-weight:700;letter-spacing:-.6px;word-break:break-word;line-height:1.15}
.spk{font-size:13px;color:var(--tx2);border:1px solid var(--line);border-radius:99px;padding:3px 11px}
.pos{font-size:11.5px;background:#5b6472;color:#fff;border-radius:5px;padding:2px 7px;font-weight:600}
.mean{font-size:clamp(17px,4vw,22px);color:var(--acc);font-weight:500;line-height:1.5}
.ety{font-size:13.5px;line-height:1.6;color:var(--tx2);max-width:520px;border-top:1px solid var(--line);padding-top:11px}
.ety b{color:var(--tx)} .ety .lb{color:var(--acc);font-weight:700;font-size:11px;margin-right:5px}
.hint{font-size:12.5px;color:var(--tx2)}
.stk{font-size:11.5px;color:var(--tx2);display:flex;gap:7px;align-items:center}
.stk b{color:var(--tx)} .stk i{font-style:normal;letter-spacing:2px;color:var(--ok);font-size:10px}
.stk.grad{color:var(--gold);font-weight:600}
.pg{font-size:11px;color:var(--tx2);opacity:.7}
.acts{display:flex;gap:10px;width:100%;max-width:620px}
.acts button{flex:1;padding:15px 8px;font-size:15px;font-weight:600;border-radius:14px}
.acts .yes{border-color:var(--ok);color:var(--ok)} .acts .no{border-color:var(--no);color:var(--no)}
.acts button:disabled{opacity:.32;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:620px;width:100%}
.row button{font-size:12.5px;padding:7px 11px}
.mini{font-size:11.5px;color:var(--tx2);text-align:center;line-height:1.6;max-width:620px}
kbd{background:var(--card2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
 padding:1px 6px;font-family:inherit;font-size:11.5px;font-weight:600}
.big{font-size:clamp(24px,6vw,34px);font-weight:700;letter-spacing:-.5px}
.sub{font-size:15px;color:var(--tx2);line-height:1.8}
.panel{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
.panel.on{display:flex}
.panel .head{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel .head h2{font-size:15px;margin:0;font-weight:600}
.panel .bd{flex:1;overflow:auto;padding:14px 16px 40px}
.item{display:flex;gap:12px;align-items:baseline;padding:9px 10px;border-bottom:1px solid var(--line)}
.item .e{font-weight:600;min-width:150px} .item .k{color:var(--tx2);font-size:13.5px;flex:1}
table{width:100%;border-collapse:collapse;font-size:13.5px;max-width:720px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--tx2);font-weight:600;font-size:12px}
textarea{width:100%;max-width:720px;height:150px;background:var(--card2);color:var(--tx);
 border:1px solid var(--line);border-radius:10px;padding:10px;font:13px/1.5 ui-monospace,monospace;resize:vertical}
select{font:inherit;font-size:12.5px;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;max-width:230px}
.tag{display:inline-block;font-size:11.5px;color:var(--tx2);background:var(--card2);
 border:1px solid var(--line);border-radius:99px;padding:2px 9px}
</style>
</head>
<body>

<header>
  <h1>단어 암기 트레이너</h1>
  <span class="tag" id="poolTag">기본 풀</span>
  <span class="sp"></span>
  <button class="ghost" id="btnToday">📅 오늘 묶음</button>
  <button class="ghost" id="btnPool">단어 풀 바꾸기</button>
  <button class="ghost" id="btnHist">기록</button>
</header>

<main id="main"></main>

<!-- 단어 풀 패널 -->
<div class="panel" id="pnPool">
  <div class="head"><h2>단어 풀 바꾸기</h2><span style="flex:1"></span>
    <button class="ghost" id="poolClose">닫기 (Esc)</button></div>
  <div class="bd">
    <div style="max-width:720px;margin-bottom:16px;text-align:left">
      <div class="mini" style="text-align:left;margin-bottom:6px"><b>최소 유지 모드 묶음 고르기</b> (지난 날 묶음을 다시 할 때)</div>
      <div class="row" style="justify-content:flex-start" id="planPick"></div>
    </div>
    <p class="mini" style="text-align:left;max-width:720px;margin-bottom:12px">
      첫 번째 프로그램에서 <b>“모르는 단어 → CSV 저장”</b>으로 받은 파일을 그대로 넣으면 돼요.
      단어만 한 줄씩 적은 TXT도 됩니다. 뜻·어원은 내장 사전(2,024개)에서 자동으로 붙어요.
    </p>
    <div class="row" style="justify-content:flex-start;margin-bottom:14px">
      <button id="poolFileBtn">CSV / TXT 파일 선택</button>
      <button id="poolDefault">기본 풀 (어원 있는 862개)</button>
      <button id="poolAll">전체 2,024개</button>
      <input type="file" id="poolFile" accept=".csv,.txt,.tsv" style="display:none">
    </div>
    <label class="mini" style="display:flex;gap:7px;align-items:center;justify-content:flex-start;margin-bottom:12px;cursor:pointer">
      <input type="checkbox" id="incGrad"> 졸업한 단어(연속 5회 정답)도 포함해서 보기
    </label>
    <p class="mini" style="text-align:left;margin-bottom:6px">또는 여기에 붙여넣기 (한 줄에 단어 하나, 또는 CSV 그대로)</p>
    <textarea id="poolText" placeholder="abandon&#10;abstract&#10;academic"></textarea>
    <div class="row" style="justify-content:flex-start;margin-top:10px">
      <button id="poolApply">이 목록으로 시작</button>
    </div>
    <div id="poolMsg" class="mini" style="text-align:left;margin-top:12px"></div>
  </div>
</div>

<!-- 기록 패널 -->
<div class="panel" id="pnHist">
  <div class="head"><h2>학습 기록</h2><span style="flex:1"></span>
    <button class="ghost" id="histClear">기록 삭제</button>
    <button class="ghost" id="histClose">닫기 (Esc)</button></div>
  <div class="bd" id="histBody"></div>
</div>

<script>

function freshSession(pool, name){
  return {pool:pool.slice(), poolName:name, round:1, queue:shuffle(pool.slice()), idx:0,
          wrong:[], rounds:[], startedAt:Date.now(), elapsed:0, revealed:false, known:0, log:[]};
}
function loadState(){
  try{ const s=JSON.parse(localStorage.getItem(LS));
    if(s&&s.queue){                       // 이어서 할 때도 남은 단어 순서는 새로 섞는다
      const rest=shuffle(s.queue.slice(s.idx));
      s.queue=s.queue.slice(0,s.idx).concat(rest);
      s.revealed=false; s.log=s.log||[];
      return s;
    } }catch(e){}
  return freshSession(dropGrad(DEFAULT_POOL),'어원 862개');
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function history(){ try{ return JSON.parse(localStorage.getItem(LS+'_hist'))||[]; }catch(e){ return []; } }
function pushHistory(rec){ try{ const h=history(); h.unshift(rec);
  localStorage.setItem(LS+'_hist', JSON.stringify(h.slice(0,50))); }catch(e){} }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const fmt = ms => { const s=Math.round(ms/1000); return (s>=60? Math.floor(s/60)+'분 ':'')+(s%60)+'초'; };

function saveST(){ try{ localStorage.setItem(LS+'_streak', JSON.stringify(ST)); }catch(e){} }
const keyOf = i => DATA[i][0].toLowerCase();
function stOf(i){ return ST[keyOf(i)] || {s:0,g:0}; }
function isGrad(i){ return !!stOf(i).g; }
function gradCount(){ return Object.values(ST).filter(v=>v.g).length; }
let includeGrad = localStorage.getItem(LS+'_incgrad')==='1';
function dropGrad(pool){ return includeGrad? pool.slice() : pool.filter(i=>!isGrad(i)); }

/* ---------- 발음 (영어 음성 강제) ---------- */
let voices=[], voice=null, voiceWarn='';
const VKEY = LS+'_voice';
function englishVoices(){
  return speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang||''));
}
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  voices = englishVoices();
  if(!voices.length){ voice=null; voiceWarn='이 브라우저에 영어 음성이 없어요. Chrome/Edge에서 열거나 OS에 영어 음성을 추가해 주세요.'; return; }
  voiceWarn='';
  const saved = localStorage.getItem(VKEY);
  voice = voices.find(v=>v.name===saved)
       || voices.find(v=>/en-US/i.test(v.lang) && /Google US English|Samantha|Aria|Jenny|Zira/i.test(v.name))
       || voices.find(v=>/en-US/i.test(v.lang))
       || voices.find(v=>/en-GB/i.test(v.lang))
       || voices[0];
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=()=>{ const had=!!voice; pickVoice(); if(voice){ flushPending(); if(!had) render(); } };
  // 크롬·엣지는 음성 목록을 늦게 채우므로 잠시 폴링
  let tries=0; const t=setInterval(()=>{ if(voice||++tries>30) return clearInterval(t);
    pickVoice(); if(voice){ clearInterval(t); flushPending(); render(); } },150);
}
let mute = localStorage.getItem(LS+'_mute')==='1';
let pending=null, lastSpokeKey=null;
function flushPending(){ if(pending && voice){ const t=pending; pending=null; speak(t); } }
function speak(t){
  if(mute || !('speechSynthesis' in window)) return;
  if(!voice) pickVoice();
  if(!voice){ pending=t; return; }        // 영어 음성이 없으면 아예 발음하지 않음
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t.replace(/\[.*?\]/g,' ').replace(/[()]/g,' ').replace(/\s+/g,' ').trim());
    u.lang = (voice && voice.lang) || 'en-US';
    u.rate=.88; u.pitch=1; u.volume=1;
    if(voice) u.voice=voice;          // ← 한국어 기본 음성으로 읽히는 것 방지
    speechSynthesis.speak(u);
  }catch(e){}
}
function voiceSelectHTML(){
  if(!('speechSynthesis' in window)) return '';
  if(!voices.length){
    const all=(speechSynthesis.getVoices()||[]).length;
    return `<span class="mini" style="color:var(--no);max-width:420px">영어 음성을 못 찾았어요 (설치된 음성 ${all}개).
      한국어 음성으로 읽히는 걸 막으려고 발음을 껐어요. Chrome 또는 Edge에서 열거나,
      Windows 설정 → 시간 및 언어 → 언어 → English 추가 → 음성 팩 설치 후 다시 열어 주세요.</span>`;
  }
  return `<select id="vsel" title="영어 음성 선택">`+
    voices.map(v=>`<option value="${v.name.replace(/"/g,'')}" ${voice&&v.name===voice.name?'selected':''}>${v.name} (${v.lang})</option>`).join('')+
    `</select> <span class="mini" style="opacity:.75">영어 음성 ${voices.length}개</span>`;
}
function bindVoiceSelect(){
  const el=document.getElementById('vsel'); if(!el) return;
  el.onchange=()=>{ voice=voices.find(v=>v.name===el.value)||voice;

  if(!S.revealed && REVEAL_MS>0){
    const at=key;
    revealTimer=setTimeout(()=>{ if(screen==='card' && !S.revealed && (S.round+':'+S.idx)===at) reveal(); }, REVEAL_MS);
  }
}
function streakHTML(i){
  const st=stOf(i);
  if(st.g) return `<div class="stk grad">🎓 졸업한 단어</div>`;
  return `<div class="stk">연속 정답 <b>${st.s}</b> / ${GRAD}
    <i>${'●'.repeat(st.s)}${'○'.repeat(Math.max(0,GRAD-st.s))}</i></div>`;
}
function reveal(){ S.revealed=true; save(); render(); }
function answer(know){
  clearReveal();
  const id=S.queue[S.idx], k=keyOf(id);
  const cur=ST[k]||{s:0,g:0};
  const prev={s:cur.s, g:cur.g};
  if(know){ cur.s=(cur.s||0)+1; if(cur.s>=GRAD) cur.g=1; }
  else    { cur.s=0; cur.g=0; }
  cur.t=Date.now(); ST[k]=cur; saveST();
  if(know) S.known++; else if(!S.wrong.includes(id)) S.wrong.push(id);
  (S.log=S.log||[]).push({id:id, know:know, prev:prev});
  S.idx++; S.revealed=false; S.elapsed=Date.now()-S.startedAt; save(); render();
}

function goBack(){
  S.log=S.log||[];
  if(S.idx<=0 || !S.log.length) return;
  const last=S.log.pop();
  S.idx--;
  clearReveal();
  if(last.prev){ ST[keyOf(last.id)]={s:last.prev.s, g:last.prev.g, t:Date.now()}; saveST(); }
  if(last.know) S.known=Math.max(0,S.known-1);
  else { const k=S.wrong.indexOf(last.id); if(k>=0) S.wrong.splice(k,1); }
  S.revealed=true;                 // 뜻을 보여준 채로 다시 고르게
  screen='card'; lastSpokeKey=S.round+':'+S.idx; save(); render();
}

function dl(name,text){
  try{ const blob=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }catch(e){ alert('저장에 실패했어요.'); }
}
function wrongCSV(){
  const q=c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"';
  return [['word','meaning','page','streak'].map(q).join(',')].concat(
    S.wrong.map(i=>[DATA[i][0],DATA[i][1],DATA[i][3],stOf(i).s].map(q).join(','))).join('\n');
}
function saveWrong(){
  if(!S.wrong.length) return;
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const stamp=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
  dl(`잔여_${stamp}_${S.wrong.length}개.csv`, wrongCSV());
}

function renderRoundEnd(){
  planRecord();
  const total=S.queue.length, w=S.wrong.length;
  main.innerHTML=`
  <div class="card" style="cursor:default">
    <div class="big">${S.round}바퀴 완료</div>
    <div class="sub">${total}개 중 <b style="color:var(--no)">${w}개</b> 모름 · 정답률 ${Math.round((total-w)/total*100)}%<br>
      지금까지 ${fmt(S.elapsed)}</div>
    <button id="next" style="margin-top:14px;padding:13px 26px;font-weight:600">
      모르는 ${w}개만 다시 (Space)</button>
    <div class="mini" style="margin-top:4px">${S.plan? '✅ 오늘 오답을 자동 저장했어요 (일요일에 모여요). 여기서 끝내면 돼요.' : '하루 1바퀴만 할 거면 여기서 <b>CSV로 저장</b>하고 끝내세요.'}</div>
    <div class="row" style="margin-top:2px">
      <button class="ghost" id="saveWrong">모르는 ${w}개 CSV 저장 (다음 세션 풀)</button>
      <button class="ghost" id="showWrong">목록 보기</button>
    </div>
  </div>`;
  document.getElementById('next').onclick=nextRound;
  document.getElementById('saveWrong').onclick=saveWrong;
  document.getElementById('showWrong').onclick=()=>{
    document.getElementById('histBody').innerHTML =
      `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
         <h3 style="font-size:15px">${S.round}바퀴에서 틀린 단어 ${S.wrong.length}개</h3>
         <button class="ghost" id="saveWrong2" style="font-size:12px;padding:5px 10px">CSV 저장</button></div>`+
      S.wrong.map(i=>`<div class="item"><span class="e">${DATA[i][0]}</span><span class="k">${DATA[i][1]}</span></div>`).join('');
    document.getElementById('pnHist').classList.add('on');
    document.getElementById('saveWrong2').onclick=saveWrong;
  };
}
function nextRound(){
  S.rounds.push({round:S.round, total:S.queue.length, wrong:S.wrong.length, at:Date.now()});
  S.round++; S.queue=shuffle(S.wrong.slice()); S.wrong=[]; S.idx=0; S.known=0; S.revealed=false; S.log=[];
  screen='card'; save(); render();
}

function renderDone(){
  planRecord();
  S.rounds.push({round:S.round,total:S.queue.length,wrong:0,at:Date.now()});
  const rec={poolName:S.poolName, size:S.pool.length, rounds:S.rounds.slice(),
             elapsed:S.elapsed, finishedAt:Date.now()};
  pushHistory(rec);
  main.innerHTML=`
  <div class="card" style="cursor:default;gap:16px">
    <div class="big">🎉 전부 다 외웠어요</div>
    <div class="sub">${S.poolName} · ${S.pool.length}개 &nbsp;|&nbsp; 총 ${S.rounds.length}바퀴 &nbsp;|&nbsp; ${fmt(S.elapsed)}</div>
    <table><tr><th>바퀴</th><th>출제</th><th>모름</th><th>정답률</th></tr>
      ${rec.rounds.map(r=>`<tr><td>${r.round}바퀴</td><td>${r.total}개</td>
        <td style="color:${r.wrong?'var(--no)':'var(--ok)'}">${r.wrong}개</td>
        <td>${Math.round((r.total-r.wrong)/r.total*100)}%</td></tr>`).join('')}
    </table>
    <div class="mini">기록에 저장했어요. 아래 버튼을 누르면 처음 상태로 돌아가요.</div>
    <button id="rs" style="padding:13px 26px;font-weight:600">리셋하고 다시 시작 (Space)</button>
  </div>`;
  document.getElementById('rs').onclick=doReset;
}
function doReset(){ S=freshSession(S.pool,S.poolName); screen='start'; save(); render(); }
function resetAsk(){ if(confirm('진행 상황을 지우고 처음부터 다시 시작할까요?')) doReset(); }

/* ---------- 키보드 ---------- */
document.addEventListener('keydown',ev=>{
  const openPanel=[...document.querySelectorAll('.panel.on')][0];
  if(openPanel){ if(ev.key==='Escape') openPanel.classList.remove('on'); return; }
  if(ev.target.tagName==='TEXTAREA'||ev.target.tagName==='INPUT') return;
  const k=ev.key.toLowerCase();
  if(ev.code==='Space'){ ev.preventDefault();
    if(screen==='start') return start();
    if(screen==='round') return nextRound();
    if(screen==='done')  return doReset();
    return reveal(); }
  if(k==='s' && screen!=='done'){ ev.preventDefault(); return goBack(); }
  if(screen!=='card') return;
  if(k==='a'){ answer(true); }
  else if(k==='d'){ answer(false); }
  else if(k==='r'){ speak(DATA[S.queue[S.idx]][0]); }
});

/* ---------- 단어 풀 ---------- */
const $=id=>document.getElementById(id);
$('btnPool').onclick=()=>{$('pnPool').classList.add('on');$('poolMsg').textContent='';
  $('incGrad').checked=includeGrad;};
$('incGrad').onchange=()=>{ includeGrad=$('incGrad').checked;
  localStorage.setItem(LS+'_incgrad', includeGrad?'1':'0'); };
$('poolClose').onclick=()=>$('pnPool').classList.remove('on');
$('poolDefault').onclick=()=>applyPool(DEFAULT_POOL,'어원 862개');
$('poolAll').onclick=()=>applyPool(DATA.map((_,i)=>i),'전체 단어');
$('poolFileBtn').onclick=()=>$('poolFile').click();
$('poolFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>parseText(r.result, f.name); r.readAsText(f,'utf-8'); };
$('poolApply').onclick=()=>parseText($('poolText').value,'붙여넣은 목록');

function parseText(txt,name){
  const words=[], extra=[];
  txt.split(/\r?\n/).forEach((ln,i)=>{
    if(!ln.trim()) return;
    let cells = ln.includes('\t') ? ln.split('\t') : (ln.match(/("([^"]|"")*"|[^,]*)(,|$)/g)||[ln]);
    cells = cells.map(c=>c.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"').trim());
    const w=cells[0]; if(!w) return;
    if(i===0 && /^(word|영단어|english)$/i.test(w)) return;      // 헤더 건너뛰기
    const key=w.toLowerCase();
    if(byWord[key]!==undefined) words.push(byWord[key]);
    else { DATA.push([w, cells[1]||'(뜻 없음)', '', cells[2]||'', '']); byWord[key]=DATA.length-1;
           words.push(DATA.length-1); extra.push(w); }
  });
  const uniq=[...new Set(words)];
  if(!uniq.length){ $('poolMsg').textContent='단어를 찾지 못했어요. 첫 번째 칸에 영단어가 있는지 확인해 주세요.'; return; }
  $('poolMsg').innerHTML = `${uniq.length}개를 불러왔어요.`+
    (extra.length? ` 내장 사전에 없는 ${extra.length}개(${extra.slice(0,5).join(', ')}${extra.length>5?' 외':''})는 CSV의 뜻을 그대로 씁니다.`:'');
  applyPool(uniq, name.replace(/\.(csv|txt|tsv)$/i,''));
}
function applyPool(pool,name){
  const kept=dropGrad(pool), cut=pool.length-kept.length;
  if(!kept.length){ $('poolMsg').textContent='이 목록은 전부 졸업한 단어예요. "졸업 단어도 포함"을 켜면 다시 볼 수 있어요.'; return; }
  if(cut) $('poolMsg').innerHTML = ($('poolMsg').innerHTML||'') + ` 졸업한 ${cut}개는 제외했어요.`;
  S=freshSession(kept,name); screen='start'; save(); render();
  $('pnPool').classList.remove('on');
}

/* ---------- 기록 ---------- */
$('btnHist').onclick=()=>{ renderHist(); $('pnHist').classList.add('on'); };
$('histClose').onclick=()=>$('pnHist').classList.remove('on');
$('histClear').onclick=()=>{ if(confirm('저장된 학습 기록을 모두 지울까요?')){
  localStorage.removeItem(LS+'_hist'); renderHist(); } };
function renderHist(){
  const h=history();
  const gc=gradCount();
  $('histBody').innerHTML = `<div class="mini" style="text-align:left;margin-bottom:14px">
     졸업한 단어 <b style="color:var(--ok)">${gc}개</b> · 연속 ${GRAD}회 정답이면 자동 졸업하고 다음 풀에서 빠져요.
     <button class="ghost" id="gradReset" style="margin-left:8px;font-size:11.5px;padding:4px 9px">졸업 기록 초기화</button></div>`
   + (h.length? `<table>
    <tr><th>완료 시각</th><th>단어 풀</th><th>바퀴</th><th>바퀴별 오답</th><th>소요 시간</th></tr>
    ${h.map(r=>`<tr>
      <td>${new Date(r.finishedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
      <td>${r.poolName} (${r.size})</td><td>${r.rounds.length}바퀴</td>
      <td>${r.rounds.map(x=>x.wrong).join(' → ')}</td><td>${fmt(r.elapsed)}</td></tr>`).join('')}
   </table>` : '<div class="mini" style="padding:20px 0;text-align:left">아직 완료한 세션 기록이 없어요.</div>');
  const gr=document.getElementById('gradReset');
  if(gr) gr.onclick=()=>{ if(confirm('단어별 연속 정답·졸업 기록을 모두 지울까요?')){
    ST={}; saveST(); renderHist(); render(); } };
}

/* ---------- 최소 유지 모드 ---------- */
const DAYN=['일','월','화','수','목','금','토'];
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
function planLoad(k){ try{ return JSON.parse(localStorage.getItem(LS+k))||{}; }catch(e){ return {}; } }
function planSave(k,v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){} }
function planToday(){
  const s=new Date(PLAN.start+'T00:00:00'), n=new Date(); n.setHours(0,0,0,0);
  const diff=Math.round((n-s)/864e5);
  if(diff<0) return {before:true, start:PLAN.start};
  const w=Math.floor(diff/7)+1, dow=n.getDay();
  if(w>PLAN.weeks.length) return {after:true};
  return {w:w, b: dow===0? 6 : dow-1, date:ymd(n)};
}
function planPool(w,b){                                   // b 0~5 = 월~토 묶음, 6 = 일요일(그 주 오답)
  if(b<6) return PLAN.weeks[w-1][b].slice();
  const mw=planLoad('_mw'), all=[];
  for(let i=0;i<6;i++) (mw[w+'-'+i]||[]).forEach(x=>{ if(!all.includes(x)) all.push(x); });
  return all;
}
const planName=(w,b)=> b<6? `${w}주차 ${DAYN[b+1]} · 묶음 ${b+1}/6` : `${w}주차 일요일 · 이번 주 오답`;
function planOpen(w,b,date){
  const pool=planPool(w,b);
  if(!pool.length){ alert(b<6? '묶음을 찾지 못했어요.' : '이번 주에 저장된 오답이 없어요. 월~토 묶음을 먼저 해 주세요.'); return; }
  applyPool(pool, planName(w,b));
  if(S.poolName!==planName(w,b)) return;
  const pd=new Date(PLAN.start+'T00:00:00'); pd.setDate(pd.getDate()+7*(w-1)+b);
  S.plan={w:w,b:b,date:ymd(pd)}; save(); render();
}
function planRecord(){                                     // 1바퀴가 끝난 순간 한 번만 기록
  if(!S.plan || S.round!==1 || S.plan.rec) return;
  const mw=planLoad('_mw'); mw[S.plan.w+'-'+S.plan.b]=S.wrong.slice(); planSave('_mw',mw);
  const md=planLoad('_mdone');
  md[S.plan.w+'-'+S.plan.b]={w:S.plan.w, b:S.plan.b, planDate:S.plan.date, doneAt:ymd(new Date()), total:S.queue.length, wrong:S.wrong.length};  // 키 = 주차-묶음(0~5 월~토, 6 일)
  planSave('_mdone',md);
  S.plan.rec=1; save();
}
function openToday(auto){
  const t=planToday();
  if(t.before){ if(!auto) alert(`최소 유지 모드는 ${PLAN.start}(월)부터 시작해요.`); return; }
  if(t.after){ if(!auto) alert('최소 유지 모드 6주가 끝났어요.'); return; }
  if(S.plan && S.plan.w===t.w && S.plan.b===t.b && S.plan.date===t.date){ screen='start'; render(); return; }  // 오늘 하던 것 이어서
  planOpen(t.w,t.b,t.date);
}
$('btnToday').onclick=()=>openToday(false);
function renderPlanPick(){
  const el=$('planPick'); if(!el) return;
  const t=planToday(), cur=t.w||(t.after?PLAN.weeks.length:1);
  el.innerHTML=`<select id="pwk">${PLAN.weeks.map((_,i)=>`<option value="${i+1}" ${i+1===cur?'selected':''}>${i+1}주차</option>`).join('')}</select>`+
    [0,1,2,3,4,5,6].map(b=>`<button data-b="${b}">${b<6?DAYN[b+1]:'일(오답)'}</button>`).join('');
  el.querySelectorAll('button').forEach(bt=>bt.onclick=()=>{ planOpen(+$('pwk').value, +bt.dataset.b); $('pnPool').classList.remove('on'); });
}
const _btnPool=$('btnPool').onclick;
$('btnPool').onclick=()=>{ _btnPool(); renderPlanPick(); };

render();
if(/today/.test(location.hash)) openToday(true);
</script>
